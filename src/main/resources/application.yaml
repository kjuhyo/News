spring:
  application:
    name: news
  freemarker:
    suffix: .ftl
    template-loader-path: classpath:/templates/
    cache: false
  datasource:
    url: jdbc:sqlite:news.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    show-sql: true

server:
  port: 8081

kind: Application